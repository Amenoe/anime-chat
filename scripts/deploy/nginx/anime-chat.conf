resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;
proxy_cache_path /var/cache/nginx/bgm_api levels=1:2 keys_zone=bgm_api_cache:10m max_size=200m inactive=30m use_temp_path=off;
proxy_cache_path /var/cache/nginx/bgm_img levels=1:2 keys_zone=bgm_img_cache:50m max_size=1g inactive=7d use_temp_path=off;

# IP 直连（保留原来的 http 访问，方便排障）
server {
    listen 80;
    server_name 8.130.120.172;

    root /www/wwwroot/anime-chat/client/dist;
    index index.html;
    client_max_body_size 20m;

    access_log /www/wwwlogs/anime-chat.log;
    error_log /www/wwwlogs/anime-chat.error.log;

    include /www/server/panel/vhost/nginx/anime-chat-locations.inc;
}

# 域名 http 统一跳 https（www 为准）
server {
    listen 80;
    server_name rainmory.xyz www.rainmory.xyz;
    return 301 https://www.rainmory.xyz$request_uri;
}

# 域名 https
server {
    listen 443 ssl;
    http2 on;
    server_name rainmory.xyz www.rainmory.xyz;

    root /www/wwwroot/anime-chat/client/dist;
    index index.html;
    client_max_body_size 20m;

    access_log /www/wwwlogs/anime-chat.log;
    error_log /www/wwwlogs/anime-chat.error.log;

    # 裸域统一跳到 www，避免页面在裸域、socket 连 www 造成跨子域
    if ($host = rainmory.xyz) {
        return 301 https://www.rainmory.xyz$request_uri;
    }

    ssl_certificate /www/server/panel/vhost/cert/anime-chat/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/anime-chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include /www/server/panel/vhost/nginx/anime-chat-locations.inc;
}
